[workspace]
resolver = "3"
members = ["crates/glass-api", "crates/glass-gesture", "crates/glass-evdev", "crates/glass-head", "crates/glass-hub", "crates/glassd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/OpenMyGlass/glass-services"
rust-version = "1.88"

[workspace.dependencies]
glass-api = { path = "crates/glass-api" }
glass-gesture = { path = "crates/glass-gesture" }
glass-evdev = { path = "crates/glass-evdev" }
glass-head = { path = "crates/glass-head" }
glass-hub = { path = "crates/glass-hub" }
libc = "0.2"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
# The companion-link wire protocol, shared verbatim with the OpenMyGlass companion so the
# schema cannot drift. Pinned to a rev; this is the one dependency glassd takes on the
# companion workspace (pure data + serde, no async, no I/O). See crates/glassd/src/companion.
omg-protocol = { git = "https://github.com/OpenMyGlass/OpenMyGlass", rev = "ceb692220e51ad888eed5f8554d1e00ad3e13d0f" }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
getrandom = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
