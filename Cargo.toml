[workspace]
resolver = "3"
exclude = ["vendor"]
members = ["crates/glass-api", "crates/glass-gesture", "crates/glass-evdev", "crates/glass-head", "crates/glass-hub", "crates/glass-qr", "crates/glassd", "crates/omg-bled"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/OpenMyGlass/glass-services"
rust-version = "1.88"

[workspace.dependencies]
glass-api = { path = "crates/glass-api" }
glass-gesture = { path = "crates/glass-gesture" }
glass-evdev = { path = "crates/glass-evdev" }
glass-head = { path = "crates/glass-head" }
glass-hub = { path = "crates/glass-hub" }
libc = "0.2"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
# The companion-link wire protocol, shared verbatim with the OpenMyGlass companion so the
# schema cannot drift, and the note queue and its state machine with it. Pinned to a rev.
# omg-core builds without an async runtime by default, and must stay that way here: never enable
# its async-link feature in a normal dependency. See crates/glassd/src/companion.
omg-protocol = { git = "https://github.com/OpenMyGlass/OpenMyGlass", rev = "3911b29f86f466fa9d596afed58bafa3942b72ed" }
omg-core = { git = "https://github.com/OpenMyGlass/OpenMyGlass", rev = "3911b29f86f466fa9d596afed58bafa3942b72ed" }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
getrandom = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The QR decoder, with one fix for its worst case: see vendor/quircs/VENDORED.md.
[patch.crates-io]
quircs = { path = "vendor/quircs" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# TEMPORARY, while the session encryption is unmerged in OpenMyGlass: remove this section and set
# the two revs above to the merge commit, then `cargo update -p omg-protocol -p omg-core`.
